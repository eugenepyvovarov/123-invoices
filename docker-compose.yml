name: ${COMPOSE_PROJECT_NAME:-03-invoices}

version: "3.9"

x-app-service: &app-service
  image: ${INVOICES_IMAGE:-${REGISTRY_IMAGE:-git.ultramac.work/lifeisgoodlabs/invoices}:latest}
  env_file:
    - .env
  volumes:
    - ./db:/app/db
    - ./media:/app/media
    - ./.env:/app/.env:ro
  restart: unless-stopped

services:
  web:
    <<: *app-service
    environment:
      - DEBUG=0
      - BACKUP_EXECUTION_LOCK_PATH=/app/media/.locks/backup-execution.lock
      - RUN_MIGRATIONS=1
    command: gunicorn app.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"

  scheduler:
    <<: *app-service
    environment:
      - DEBUG=0
      - BACKUP_EXECUTION_LOCK_PATH=/app/media/.locks/backup-execution.lock
      - RUN_MIGRATIONS=0
    command: python manage.py run_backup_scheduler
    depends_on:
      - web

  mcp:
    <<: *app-service
    environment:
      - DEBUG=0
      - RUN_MIGRATIONS=0
      - INVOICES_MCP_HOST=0.0.0.0
      - INVOICES_MCP_PORT=${INVOICES_MCP_PORT:-8765}
      - INVOICES_MCP_API_BASE_URL=${INVOICES_MCP_API_BASE_URL:-http://web:8000/api/}
    command: python -m invoices_mcp.server
    expose:
      - "${INVOICES_MCP_PORT:-8765}"
    depends_on:
      - web
