{% load l10n %}
<div id="paymentDrawer" class="invoice-drawer" aria-hidden="true" data-payment-drawer data-testid="payment-drawer" data-drawer-state="closed">
  <div class="invoice-drawer__backdrop" data-payment-drawer-close></div>
  <section class="invoice-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="paymentDrawerLabel" data-testid="payment-drawer-panel">
    <header class="invoice-drawer__header">
      <h2 id="paymentDrawerLabel">Add Payment</h2>
      <button type="button" aria-label="Close drawer" class="icon-button" data-payment-drawer-close data-testid="payment-drawer-close">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-x" width="20" height="20" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6l-12 12" />
          <path d="M6 6l12 12" />
        </svg>
      </button>
    </header>
    <div id="paymentDrawerContent" class="invoice-drawer__body" data-payment-drawer-content data-testid="payment-drawer-content">
      <!-- Content loaded via AJAX -->
    </div>
  </section>
  <template id="paymentFormTemplate">
    <form id="paymentForm" method="post" class="stack-gap-md" data-payment-form data-testid="payment-form" data-form-mode="add" data-submit-state="idle">
      {% csrf_token %}
      {% if invoice %}
      <input type="hidden" name="invoice_id" value="{{ invoice.id|unlocalize }}" />
      {% endif %}
      {% if payment_context == 'invoice' and selected_project_id %}
      <input type="hidden" name="project_id" value="{{ selected_project_id|unlocalize }}" />
      {% endif %}
      <input type="hidden" name="payment_id" value="" data-payment-id-field />
      <div class="drawer-section">
        <div class="row mb-2">
          <div class="col-md-12">
            <label for="payment_project" class="form-label">Project</label>
            <select id="payment_project" name="project_id" class="form-control" data-testid="payment-project-select"{% if payment_context == 'invoice' %} disabled{% endif %}>
              {% for prj in customer_projects %}
                <option value="{{ prj.id|unlocalize }}" {% if prj.id == selected_project_id %}selected{% endif %}>
                  {{ prj.project_code }} — {{ prj.title }}
                </option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <label for="payment_amount" class="form-label">Amount</label>
            <input id="payment_amount" name="amount" type="number" step="0.01" min="0" class="form-control" data-testid="payment-amount-input" value="{% if payment_context == 'invoice' %}{{ invoice_remaining|floatformat:2|cut:',' }}{% else %}{% endif %}" placeholder="0.00" required lang="en" inputmode="decimal" />
          </div>
          <div class="col-md-6">
            <label for="payment_date" class="form-label">Received at</label>
            <input id="payment_date" name="received_at" type="date" class="form-control" data-testid="payment-date-input" value="{% now 'Y-m-d' %}" required />
          </div>
          <div class="form-text small text-muted">Amount will be applied to selected invoice(s).</div>
        </div>
        <div class="row mt-3">
          <div class="col-md-12">
            <label class="form-label">Apply to invoices</label>
            {% if project_outstanding_invoices %}
              <div class="table-responsive">
                <table class="table table-sm align-middle mb-0" data-testid="payment-invoice-table">
                  <thead>
                    <tr>
                      <th></th>
                      <th>Invoice</th>
                      <th>Date</th>
                      <th class="text-end">Amount</th>
                    </tr>
                  </thead>
                  <tbody>
                    {% for inv in project_outstanding_invoices %}
                      <tr data-testid="payment-invoice-row">
                        <td><input type="checkbox" name="apply_to" value="{{ inv.id|unlocalize }}" data-due="{{ inv.amount_due|floatformat:2|cut:',' }}" data-testid="payment-apply-invoice" {% if payment_context == 'invoice' and invoice and inv.id == invoice.id %}checked{% endif %} /></td>
                        <td>#{% if inv.sequence_number %}{{ inv.sequence_number }}{% else %}{{ inv.id }}{% endif %}</td>
                        <td>{{ inv.issued_date|date:'Y-m-d' }}</td>
                        <td class="text-end">
                          {{ inv.total_due|floatformat:2 }} €
                          <span class="{% if inv.is_overdue %}text-danger{% endif %}"> ({{ inv.amount_due|floatformat:2 }} €)</span>
                        </td>
                      </tr>
                    {% endfor %}
                  </tbody>
                </table>
              </div>
            {% else %}
              <small class="text-muted">No outstanding invoices for this project.</small>
            {% endif %}
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-12">
            <label for="payment_memo" class="form-label">Memo</label>
            <textarea id="payment_memo" name="memo" class="form-control" rows="2" placeholder="Optional" data-testid="payment-memo-input"></textarea>
          </div>
        </div>
      </div>
      <footer class="drawer-footer d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary" data-payment-drawer-close data-testid="payment-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" data-testid="payment-submit">Add payment</button>
      </footer>
    </form>
  </template>
</div>
